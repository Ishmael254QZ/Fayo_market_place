<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | FAYO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrapper">
        <a href="../index.html" class="brand" aria-label="FAYO home">
          <span class="brand-mark">F</span>
          <span class="brand-text">FAYO</span>
        </a>
      </div>
    </header>

    <main class="container page-shell">
      <div class="form-card">
        <div class="auth-header">
          <span class="eyebrow">Welcome back</span>
          <h1>Sign in</h1>
          <p>Access your account and manage listings, orders, and saved products.</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email address</label>
            <input id="login-email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.4rem;">Login</button>
        </form>

        <div class="auth-switch">
          <span>New to FAYO? <a href="register.html" class="text-link">Create account</a></span>
        </div>
      </div>
    </main>

    <script src="../js/auth.js"></script>
  </body>
</html>
