<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | FAYO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrapper">
        <a href="../index.html" class="brand" aria-label="FAYO home">
          <span class="brand-mark">F</span>
          <span class="brand-text">FAYO</span>
        </a>
      </div>
    </header>

    <main class="container dashboard-layout">
      <aside class="sidebar">
        <h3>Admin panel</h3>
        <nav>
          <a href="#" class="active">Overview</a>
          <a href="#">Listings</a>
          <a href="#">Users</a>
          <a href="#">Reports</a>
          <a href="#">Settings</a>
        </nav>
      </aside>

      <div class="dashboard-main">
        <section class="stats-grid">
          <div class="stat-card">
            <span>Users</span>
            <strong>4,180</strong>
          </div>
          <div class="stat-card">
            <span>Sellers</span>
            <strong>1,260</strong>
          </div>
          <div class="stat-card">
            <span>Listings</span>
            <strong>8,970</strong>
          </div>
          <div class="stat-card">
            <span>Transactions</span>
            <strong>KSh 24.8M</strong>
          </div>
        </section>

        <section class="card-box">
          <h3>Moderation queue</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Listing</th>
                  <th>Seller</th>
                  <th>Category</th>
                  <th>Decision</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Office Desk Set</td>
                  <td>Home Haven</td>
                  <td>Furniture</td>
                  <td><span class="status-pill status-pending">Pending</span></td>
                </tr>
                <tr>
                  <td>Used Treadmill</td>
                  <td>Fitness Hub</td>
                  <td>Sports Equipment</td>
                  <td><span class="status-pill status-approved">Approved</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
