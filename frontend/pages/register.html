<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | FAYO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrapper">
        <a href="../index.html" class="brand" aria-label="FAYO home">
          <span class="brand-mark">F</span>
          <span class="brand-text">FAYO</span>
        </a>
      </div>
    </header>

    <main class="container page-shell">
      <div class="form-card">
        <div class="auth-header">
          <span class="eyebrow">Join FAYO</span>
          <h1>Create account</h1>
          <p>Register as a buyer, seller, or business partner and start trading securely.</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label for="register-name">Full name</label>
            <input id="register-name" type="text" placeholder="Jane Doe" required />
          </div>

          <div class="form-group">
            <label for="register-email">Email address</label>
            <input id="register-email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="register-phone">Phone number</label>
            <input id="register-phone" type="tel" placeholder="+254 712 345 678" required />
          </div>

          <div class="form-group">
            <label for="register-role">Role</label>
            <select id="register-role">
              <option value="BUYER">Buyer</option>
              <option value="SELLER">Seller</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <input id="register-password" type="password" placeholder="Create a strong password" required />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Create account</button>
        </form>

        <div class="auth-switch">
          <span>Already have an account? <a href="login.html" class="text-link">Sign in</a></span>
        </div>
      </div>
    </main>

    <script src="../js/auth.js"></script>
  </body>
</html>
